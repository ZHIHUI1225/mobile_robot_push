[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epuck-mujoco"
version = "0.1.0"
description = "Composable MuJoCo e-puck pushing scenes and Gymnasium environments"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "gymnasium>=0.29", "mujoco>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.entry-points."gymnasium.envs"]
epuck_mujoco = "epuck_mujoco.envs:register_envs"

[tool.setuptools.packages.find]
include = ["epuck_mujoco*"]
